<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FiO 2026">
<title>FiO 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23111'/></svg>">
<style>
:root{
  --bg:#ffffff; --ink:#111113; --muted:#8a8a90; --faint:#b9b9be; --line:#ededf0; --soft:#f6f6f8;
  --accent:#111113; --live:#0a7cff; --gold:#c8900a;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* header */
header{padding:calc(22px + env(safe-area-inset-top)) 0 6px}
header h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* sticky nav */
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.8) blur(14px);-webkit-backdrop-filter:saturate(1.8) blur(14px)}
.days{display:flex;justify-content:space-between;padding:10px 0 0}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 10px;color:var(--muted);position:relative}
.day small{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.day b{font-size:19px;font-weight:600;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.day.on{color:var(--ink)}
.day.on b{background:var(--ink);color:#fff}
.day.today small::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--live);margin-left:3px;vertical-align:2px}
.seg{display:flex;gap:18px;padding:0 0 10px;border-bottom:1px solid var(--line);font-size:14px}
.seg button{color:var(--muted);padding:2px 0}
.seg button.on{color:var(--ink);font-weight:600}
.seg .n{color:var(--faint);font-weight:400;margin-left:3px}

/* list */
.dayinfo{padding:18px 0 4px;color:var(--muted);font-size:14px}
.dayinfo b{color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:52px 1fr 28px;gap:0 10px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.row.past{opacity:.45}
.t{font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px;line-height:1.3}
.t .e{display:block;font-size:12px;color:var(--faint)}
.row.live .t{color:var(--live);font-weight:600}
.row.live .t::after{content:"now";display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.body{min-width:0;cursor:pointer}
.ti{font-size:16px;font-weight:500;line-height:1.35;letter-spacing:-.01em}
.row.must .ti{font-weight:600}
.meta{margin-top:3px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 8px}
.meta .r{letter-spacing:1px}
.meta .lab{color:var(--ink)}
.why{margin-top:6px;font-size:14px;color:#46464b}
.clash{margin-top:6px;font-size:12px;color:#c0362c}
.star{font-size:20px;line-height:1;color:var(--faint);padding-top:1px;text-align:right}
.star.on{color:var(--gold)}
.more{display:none;margin-top:10px}
.row.open .more{display:block}
.more h4{margin:14px 0 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.more p{margin:0;font-size:14px;color:#3a3a3f}
.more .au{color:var(--muted);font-size:13px}
a.ref{text-decoration:none;border-bottom:1px solid var(--faint)}

/* poster block */
.pblock{padding:14px 0 0;border-bottom:1px solid var(--line)}
.phead{display:grid;grid-template-columns:52px 1fr;gap:0 10px;cursor:pointer;padding-bottom:10px}
.phead .ti{font-size:15px}
.phead .meta{margin-top:1px}
.pblock .row:not(.phead){grid-template-columns:52px 1fr 28px;border-bottom:0;border-top:1px solid var(--line);padding:12px 0}
.pblock .row:not(.phead) .t{visibility:hidden}
.pblock.closed .row{display:none}
.chev{display:inline-block;transition:transform .15s;color:var(--faint);margin-left:4px}
.pblock.closed .chev{transform:rotate(-90deg)}

.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
footer{padding:28px 0 calc(40px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
footer p{margin:0 0 8px}
footer button{text-decoration:underline;text-underline-offset:2px;color:var(--muted)}
</style>
</head>
<body>

  <header>
    <h1>FiO + LS 2026</h1>

  <div id="list"></div>
  <footer>
    <p>Times are Rochester time · <a href="https://www.frontiersinoptics.com/schedule" target="_blank" rel="noopener">Official schedule</a></p>

</main>

<script>
const DATA = {"items": [{"date": "2026-09-27", "kind": "info", "title": "Registration, Galleria", "start": "08:00", "end": "17:30", "notes": ["Pick up your badge today so Monday morning is relaxed."], "id": "Registration-Galleria-0"}, {"date": "2026-09-28", "rating": "nice", "areas": ["laser", "bio"], "code": "FM1E.1", "title": "Light sheet optical tweezers as a force transducer for in situ mechanical characterization of soft tissue", "start": "08:00", "end": "08:15", "room": "Highland Room DG", "abstract": "We present the first optical tweezers platform for direct biomechanical interrogation of soft tissues, integrating femtosecond-pulsed light-sheet trapping, digital videography, two-photon excitation microscopy for high-throughput mechanical characterization with simultaneous microstructural visualization.", "authors": "Krishangi Krishna, Brown University / Gannon Lemaster, Brown University / Kimani Toussaint Jr., Brown University", "kind": "talk", "group": "Optical Methods for Biomedical Characterization", "why": "a creative use of fs pulses in biomedicine, measuring tissue mechanics and microstructure together.", "id": "FM1E.1-1"}, {"date": "2026-09-28", "rating": "nice", "code": "FM2A.1", "title": "NASA Laser Communications Networks", "start": "09:15", "end": "10:00", "room": "Grand Lilac Ballroom North", "abstract": "Abstract not availabe.", "authors": "Gregory Heckler, NASA Laser Communications Networks", "kind": "talk", "group": "FIO Visionary Session I: Space Optics", "why": "a general-interest overview. Skip it if you'd rather have coffee and walk the venue.", "id": "FM2A.1-2"}, {"date": "2026-09-28", "rating": "nice", "areas": ["bio"], "code": "FM3E.1", "title": "Monitoring and Guidance of Cardiac Ablation Therapy with Optics", "start": "10:30", "end": "11:00", "room": "Highland Room DG", "abstract": "I will present the use of optical coherence tomography and near-infrared spectroscopy to monitor and guide radiofrequency ablation treatment of cardiac arrhythmias, directly interrogating the tissue for real-time characterization.", "authors": "Christine Hendon, Columbia University", "tags": ["Invited"], "kind": "talk", "group": "Optical Coherence Tomography I", "why": "real-time optical monitoring of treatment-induced tissue change. The same basic question you face (\"did the treatment modify the material as intended?\"), but in a clinical setting.", "id": "FM3E.1-3"}, {"date": "2026-09-28", "rating": "rec", "areas": ["eye", "bio"], "code": "FM3E.4", "title": "Real-Time OCT-Guided Suprachoroidal Injection in Living Rabbits Using a Low-Cost Customizable Delivery System", "start": "11:45", "end": "12:00", "room": "Highland Room DG", "abstract": "Real-time OCT-guided suprachoroidal injection using a low-cost customized needle enabled precise and safe posterior segment ocular delivery in rabbits. OCT allowed visualization of needle placement and fluid dynamics, while injections demonstrated minimal toxicity and successful retinal gene therapy transduction.", "authors": "Phuc Nguyen, Johns Hopkins University", "kind": "talk", "group": "Optical Coherence Tomography I", "why": "ophthalmology. Posterior-segment drug and gene delivery, guided by OCT, in a translational animal model.", "id": "FM3E.4-4"}, {"date": "2026-09-28", "rating": "rec", "areas": ["eye", "bio"], "code": "FM3E.6", "title": "Computational aberration correction and de-speckling of optical coherence tomography based on image formation theory", "start": "12:15", "end": "12:30", "room": "Highland Room DG", "abstract": "We present high-resolution in vivo retinal OCT imaging by computationally restoring degraded spatial resolution. The model-based aberration-correction method and the de-speckling algorithm have been applied. High-resolution in vivo retinal volumetric imaging is enabled without hardware extension or multiple acquisitions.", "authors": "Shuichi Makita, University of Tsukuba / Xibo Wang, University of Tsukuba / Suzuyo Komeda, University of Tsukuba / Yoshiaki Yasuno, University of Tsukuba", "kind": "talk", "group": "Optical Coherence Tomography I", "why": "high-resolution in-vivo retinal imaging without extra hardware. The Tsukuba group is a leader in ophthalmic OCT.", "id": "FM3E.6-5"}, {"date": "2026-09-28", "rating": "rec", "title": "Joe Eberly Symposium", "start": "14:00", "end": "16:00", "room": "Hyatt Regency - Grand Ballroom", "abstract": "Joseph Eberly (1935–2025) was a pioneer in quantum optics from the field's earliest days and throughout its first 50 years of development. He was a dedicated mentor and teacher who inspired generations of physicists, including experimentalists and theorists alike, and is fondly remembered by the many students, colleagues and collaborators whose lives and careers he influenced. Join us for this special symposium celebrating the life and science of Joe Eberly. The session will bring together members of the scientific community to share their recent research and reflect on the enduring legacy of his work.", "kind": "event", "why": "a rare \"history of the field\" event and a chance to meet the Rochester community.", "id": "Joe-Eberly-Symposium-6"}, {"date": "2026-09-28", "rating": "nice", "label": "Alternative", "code": "FM4E.2", "title": "Probing dynamic matter via the spatiotemporal structure of light", "start": "14:15", "end": "14:45", "room": "Highland Room DG", "abstract": "Structured optical fields can serve as sensitive probes of complex, dynamic environments. We demonstrate the capabilities in both the paraxial and non-paraxial regime, for example through extracting microfluidic parameters from flowing droplet emulsions.", "authors": "Eileen Otte, University of Rochester", "tags": ["Invited"], "kind": "talk", "group": "Light Matter Interactions", "id": "FM4E.2-7"}, {"date": "2026-09-28", "rating": "rec", "areas": ["fluo"], "label": "Alternative", "code": "LM4F.3", "title": "High-Intensity Photoluminescence Spikes and Photon Antibunching from Plasmonic Silver Nanocubes", "start": "15:00", "end": "15:15", "room": "Grand Lilac Ballroom South", "abstract": "Ultrabright photoluminescence spikes, reaching up to ~1 million counts/s, appear sporadically over time in 100 nm silver nanocubes used in plasmonic nanoantennas. Photon antibunching was observed under both 405 nm and 532 nm laser excitation.", "authors": "Emily DeVeyra, University of Rochester / Svetlana Lukishova, University of Rochester", "kind": "talk", "group": "Nanophotonics and Quantum Emitters", "why": "same Rochester group as the fs-induced colour-centre poster (JTu5A.43, Tue). Meeting her Monday makes Tuesday's poster conversation easier. You could leave the Eberly Symposium for this 15-minute talk.", "id": "LM4F.3-8"}, {"date": "2026-09-28", "rating": "must", "areas": ["bio"], "code": "FM5E.1", "title": "Band-pass Raman Spectroscopy for Non-invasive Glucose Monitoring", "start": "16:00", "end": "16:30", "room": "Highland Room DG", "abstract": "Based on our first direct observation of glucose Raman signals from in-vivo skin, we introduce band-pass Raman spectroscopy, enabling non-invasive, physiological-level continuous glucose monitoring in a compact device. This will enable wearable Raman-based CGM devices.", "authors": "Jeon Woong Kang, Massachusetts Institute of Technology", "tags": ["Invited"], "kind": "talk", "group": "Deep Learning and Quantitative Imaging in Biomedical Applications", "why": "a strong translational story, and you already use Raman on your samples.", "id": "FM5E.1-9"}, {"date": "2026-09-28", "rating": "rec", "areas": ["bio", "ai"], "code": "FM5E.2", "title": "Multiscale Quantitative Phase Imaging for Precision Biology and Medicine", "start": "16:30", "end": "17:00", "room": "Highland Room DG", "abstract": "Multiscale quantitative phase imaging combines optimized bright-field optics, computational reconstruction, and AI to enable label-free mesoscale tissue pathology, longitudinal live-cell phenotyping, and 3D imaging, linking cellular biophysics with precision biology, medicine, and broad translational applications.", "authors": "Yang Liu, Univ of Illinois at Urbana-Champaign", "tags": ["Invited"], "kind": "talk", "group": "Deep Learning and Quantitative Imaging in Biomedical Applications", "why": "phase imaging relates closely to OPD measurement.", "id": "FM5E.2-10"}, {"date": "2026-09-28", "rating": "must", "areas": ["bio", "ai"], "code": "FM5E.5", "title": "Machine Learning-Based Peripheral Nerve Identification Using Polarimetric Contrast", "start": "17:30", "end": "17:45", "room": "Highland Room DG", "abstract": "We present in-vivo human peripheral nerve imaging using Rotating Crossed Polarization Imaging (RXPI), with an AUC of 0.962 for nerve tissue differentiation. Physics-derived contrast can be an effective preprocessing step for automated nerve identification.", "authors": "Haolin Liao, University of Rochester / Zongyuan Lu, University of Rochester / David Mitten, University of Rochester / Wayne Knox, University of Rochester", "kind": "talk", "group": "Deep Learning and Quantitative Imaging in Biomedical Applications", "why": "Wayne's group. Good to see before visiting him, and it gives you something to talk about.", "id": "FM5E.5-11"}, {"date": "2026-09-28", "rating": "rec", "areas": ["bio"], "title": "On-chip Nanoparticles Characterization with Coherence-gated DLS", "start": "19:00", "end": "19:00", "room": "Highland Room DG", "abstract": "We present an optofluidic platform that integrates optical fiber-based coherence-gated DLS into microfluidic channels made of PMMA for non-contact, in situ characterization of flowing nanoparticles that allows for simultaneous particle sizing and velocimetry.", "authors": "Erick Zora-Guzmán, CINVESTAV Unidad Monterrey / Roberto Alvarez-Aguirre, CINVESTAV Unidad Monterrey / Gabriel Caballero-Robledo, CINVESTAV Unidad Monterrey / Jose Guzman-Sepulveda, CINVESTAV Unidad Monterrey", "kind": "talk", "group": "Poster Pitch Oral Session I", "why": "relevant to the nano-characterisation materials you prepared for students.", "id": "On-chip-Nanoparticles-Characterization-w-12"}, {"date": "2026-09-29", "rating": "nice", "areas": ["bio"], "code": "FTu1C.3", "title": "High-NA Quantum Quantitative Phase Microscopy of Biological Samples with Two-photon Phase and Resolution Enhancement", "start": "08:45", "end": "09:00", "room": "Highland Room BJ", "abstract": "We present a high-NA quantum quantitative phase microscope incorporating double-pass Pancharatnam-Berry phase shifting, enabling two-photon phase and resolution enhancement. Phase images of calibration targets and biological cells verify accuracy and demonstrate practical microscopy applications.", "authors": "Long Nguyen, University of Rochester / A. Nicholas Black, University of Rochester / Saleem Iqbal, University of Rochester / Yang Xu, Cornell University / Robert Boyd, University of Rochester / Kevin Crampton, Pacific Northwest National Laboratory / James Evans, Pacific Northwest National Laboratory", "kind": "talk", "group": "Quantum Imaging", "id": "FTu1C.3-13"}, {"date": "2026-09-29", "rating": "nice", "code": "LTu2B.1", "title": "Classical and Quantum Photonics: From Interconnects to Processors", "start": "09:15", "end": "10:00", "room": "Grand Lilac Ballroom South", "abstract": "Integrated photonics is essential in all of modern computing hardware (AI and quantum), sensing systems, and wearable technology. To achieve desired efficiency, robustness, and functionalities of these devices, it is necessary to employ new design approaches (such as inverse design), new physics and to explore new materials and integration approaches.", "authors": "Jelena Vuckovic, Stanford University", "kind": "talk", "group": "LS Visionary Session I", "why": "one of the best speakers in the field.", "id": "LTu2B.1-14"}, {"date": "2026-09-29", "rating": "nice", "areas": ["laser"], "code": "JTu3A.1", "title": "High Power Ultrafast Reaches the Terahertz", "start": "10:30", "end": "11:30", "room": "Empire Hall - Theater", "abstract": "Terahertz light is becoming a ubiquitous tool in many scientific fields and is also increasingly deployed in industrial settings, in inspection, non-destructive testing and other security applications. Terahertz wave \"see through\" optically opaque objects, and can provide rich spectroscopic information. In science, they can excite and probe a plethora of low energy phenomena in condensed matter. While these systems have seen tremendous progress in last decades, efficient, and labbased THz generation methods combining ultra-broad broad bandwidth and high dynamic range (e.g., as provided by high THz average power and correspondingly high repetition rate) remain very rare, and most measurements remain too slow, which limits their wide applicability. In recent years, an emerging research area has gained speed: increase the average power pf broadband THz sources using state-of-the-art, high-average power ultrafast Yb-gain based lasers providing multi-100-W to kilowatt average-power levels as excitation sources. Recent results have allowed to reach power levels in the THz domain in the multi-ten to multi-hundred milliwatts in different repetition rate regions – which was previously restricted to accelerator -type THz sources. This progress opens the door to a multiplicity of new and old research areas to be re-visited. In this talk, we review recent progress in the generation of high-average power THz-TDS. We will present the state-of-the-art of high-power ultrafast laser sources with potential for driving THz sources, current technological challenges in scaling THz average power, and applications areas that could potentially benefit from these novel sources.", "authors": "Clara Saraceno, Ruhr Universität Bochum", "tags": ["Plenary"], "kind": "talk", "group": "Joint Plenary Session I", "why": "high-power ultrafast Yb lasers are the tools behind fs processing. A good way to see where the source technology is heading.", "id": "JTu3A.1-15"}, {"date": "2026-09-29", "rating": "must", "areas": ["laser"], "code": "JTu4A.46", "title": "Analysis of Three-Dimensional Ablation Shape Formed by Femtosecond Pulse Laser in Polymer Materials", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "We investigate the three-dimensional ablation profile induced by a femtosecond pulse laser using ray and thermal energy models, and find that the results accurately describe the morphology of craters formed by industrial laser ablation processing.", "authors": "LEE CHAEYOUNG, Seoul National University / Daejin Kim, Seoul National University / Yoonsuk Kim, Samsung Display Co., Ltd / Yoonyeol Lee, Samsung Display Co., Ltd / Hyunsung Park, Samsung Display Co., Ltd / Yoonchan Jeong, Seoul National University", "kind": "poster", "group": "Joint Poster Session I", "why": "directly relevant to fs processing of polymeric ophthalmic materials.", "id": "JTu4A.46-16"}, {"date": "2026-09-29", "rating": "nice", "areas": ["laser"], "code": "JTu4A.28", "title": "Lowering Costs of Two Photon Polymerization by Creation of Visible Wavelength Processes", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "We show that preexisting two photon polymerization processes can be customized to a visible light source. To demonstrate viability of our process we fabricated micro-arches on commonly used optical substrates.", "authors": "Blake Daiber, Auburn University", "kind": "poster", "group": "Joint Poster Session I", "id": "JTu4A.28-17"}, {"date": "2026-09-29", "rating": "nice", "areas": ["bio"], "code": "JTu4A.15", "title": "Amyloidosis Extracellular Matrix Remodelling Assessed by Multiphoton Microscopy", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "Multiphoton microscopy combined with quantitative collagen analysis revealed extracellular matrix remodelling in oral amyloid deposits. SHG-derived features enabled moderate discrimination between amyloid-associated and non-amyloid regions, supporting label-free optical assessment of tissue microstructure.", "authors": "Luisa Araújo, Universidade Federal de Minas Gerais / Thaís Araújo, Universidade Federal de Minas Gerais / Vanessa Bernardes, Universidade Federal de Minas Gerais / Ana Maria de Paula, Universidade Federal de Minas Gerais", "kind": "poster", "group": "Joint Poster Session I", "id": "JTu4A.15-18"}, {"date": "2026-09-29", "rating": "nice", "areas": ["bio"], "code": "JTu4A.65", "title": "Longitudinal OCT/OCTA Monitoring of Atopic Dermatitis Structure and Microvasculature", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "We demonstrate longitudinal OCT/OCTA monitoring of atopic dermatitis, capturing dynamic skin thickening, depth-resolved vascular remodeling, and treatment recovery in mice for label-free structural and multiparametric vascular assessment.", "authors": "FENGXIAN DU, XIAMEN UNIVERSITY / JUNWEI XUE, XIAMEN UNIVERSITY / Qingliang Zhao, XIAMEN UNIVERSITY", "kind": "poster", "group": "Joint Poster Session I", "id": "JTu4A.65-19"}, {"date": "2026-09-29", "rating": "nice", "areas": ["bio", "ai"], "code": "JTu4A.86", "title": "Label-Free Polarized Light Microscopy for Structural Characterization of Oral Squamous Cell Carcinoma: A Pilot Study", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "This pilot study employs label-free polarized light microscopy (PLM) to investigate structural differences between normal oral mucosa and OSCC, emphasizing collagen-rich stromal alterations and establishing a foundation for future machine learning-based tissue classification.", "authors": "Albin Shaju, Manipal School of Life Sciences / Gagan Raju, Manipal School of Life Sciences / Vathsala Patil, Manipal College of Dental Sciences / Adarsh Kudva, Manipal College of Dental Sciences / MANIKANTH KARNATI, Manipal School of Life Sciences / Nirmal Mazumder, Manipal School of Life Sciences", "kind": "poster", "group": "Joint Poster Session I", "id": "JTu4A.86-20"}, {"date": "2026-09-29", "rating": "nice", "areas": ["fluo"], "code": "JTu4A.47", "title": "Hyperspectral Imaging in Diamond Analysis", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "We demonstrate a hyperspectral imaging system for gemstones that provides co-registered pseudo-absorption fingerprints and color coordinates, enabling simultaneous identification and color analysis of natural and treated chemical vapor deposition (CVD) pink diamonds.", "authors": "Jiaying Wu, Gemological Institute of America / Daniel Jones, Gemological Institute of America / Tsung-Han Tsai, Gemological Institute of America", "kind": "poster", "group": "Joint Poster Session I", "why": "a diamond poster. Pink colour in CVD diamond comes from NV centres, so it's an applied view of the same defects as JTu5A.57.", "id": "JTu4A.47-21"}, {"date": "2026-09-29", "rating": "nice", "title": "Hear from Program Managers: US Federal Funding & Collaboration Opportunities", "start": "12:30", "end": "13:45", "room": "Empire Hall - Theater", "abstract": "Hear from program managers from federal agencies supporting the optics and photonics community. Learn about current funding opportunities, program priorities and pathways for collaboration to help advance your research.", "kind": "event", "id": "Hear-from-Program-Managers-US-Federal-Fu-22"}, {"date": "2026-09-29", "rating": "must", "areas": ["laser", "fluo", "eye"], "code": "JTu5A.61", "title": "Pulse picking enhances two-photon autofluorescence in the living mouse retina", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "Pulse picking enhanced two-photon fluorescence of the living mouse retina without increasing average excitation power. Reducing repetition rate from 80 to 4 MHz increased SNR up to 6-fold and dark-corrected fluorescence intensity 21-fold.", "authors": "Wuao Jia, University of Rochester / Rosa Martínez-Ojeda, Universidad de Murcia / Jennifer Hunter, University of Waterloo", "kind": "poster", "group": "Joint Poster Session II", "why": "fluorescence + retina + fs pulses in one poster. Relevant to how you excite and measure fluorescence in fs-written samples.", "id": "JTu5A.61-23"}, {"date": "2026-09-29", "rating": "must", "areas": ["laser", "bio"], "code": "JTu5A.83", "title": "Femtosecond Laser Two-Photon Reduction and Micromachining for Single-Step Fabrication of Flexible Capacitive Pressure Sensors", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "We demonstrate a single-step femtosecond laser fabrication approach for flexible capacitive pressure sensors by directly patterning conductive silver electrodes and microstructures in gelatin, achieving high sensitivity (2.44 kPa-1) and stable performance.", "authors": "Ajinkya Palwe, University of Connecticut / Saurabh Awasthi, University of Connecticut / Shobha Shukla, Indian Institute of Technology Bombay / Sumit Saxena, Indian Institute of Technology Bombay / SeungYeon Kang, University of Connecticut", "kind": "poster", "group": "Joint Poster Session II", "why": "fs direct writing in **gelatin**, a soft biopolymer and close to a hydrogel.", "id": "JTu5A.83-24"}, {"date": "2026-09-29", "rating": "must", "areas": ["laser", "fluo"], "code": "JTu5A.57", "title": "Ultrafast Laser Writing of NV- Centers in Diamond", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "Ultrafast laser writing in diamond with 25-fs pulses reveals NV--photoluminescence preceding noticeable structural modification, consistent with defect generation by n-photon ionization with enhanced positioning precision, suggesting path toward sub-diffraction laser writing for integrated quantum photonics.", "authors": "Arunava Das, Princeton University / Xuyang Xu, Princeton University / Vedin Dewan, Princeton University / Michelle Wang, Princeton University / Kiran Kovi, PPPL / Aleksei Zheltikov, Texas A&M University / Alastair Stacey, PPPL / Julia Mikhailova, Princeton University", "kind": "poster", "group": "Joint Poster Session II", "why": "photoluminescence appears **before** visible structural modification. The same idea as fluorescence as an early marker of fs modification.", "id": "JTu5A.57-25"}, {"date": "2026-09-29", "rating": "rec", "areas": ["laser", "fluo"], "code": "JTu5A.43", "title": "Photon Antibunching from Femtosecond-Laser-Induced Color Centers in Silicon Nitride", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "In the context of single-photon sources, we demonstrate for the first time photoluminescence from defects (color centers) created in low-autofluorescence silicon nitride by femtosecond laser irradiation. Photon antibunching with g(2)(0) = 0.45 was observed.", "authors": "Emily DeVeyra, U of Rochester, The Institute of Optics / Svetlana Lukishova, U of Rochester, The Institute of Optics / Martin Sanchez, U of Rochester, The Institute of Optics / Matthew Belzer, U of Rochester, The Institute of Optics / Pablo Postigo, U of Rochester, The Institute of Optics / Michele Cotrufo, U of Rochester, The Institute of Optics", "kind": "poster", "group": "Joint Poster Session II", "why": "fs-induced defects that fluoresce. Mechanistic parallels to fluorophore formation in LIRIC materials. A Rochester group worth meeting.", "id": "JTu5A.43-26"}, {"date": "2026-09-29", "rating": "rec", "areas": ["laser"], "code": "JTu5A.7", "title": "Controlling ablation threshold of materials with optical vortex beams", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "The ablation threshold is assumed to be immutable under fixed laser processing conditions. This work demonstrates that it can be tuned using asymmetric optical vortex beams by controlling beam helicity and shifting the phase singularity.", "authors": "Melika Afshar, Ottawa university / Jean-Luk Begin, Ottawa university / Alessio D’errico, Ottawa university / Ebrahim Karimi, Ottawa university / Ravi Bhardwaj, Ottawa university", "kind": "poster", "group": "Joint Poster Session II", "id": "JTu5A.7-27"}, {"date": "2026-09-29", "rating": "rec", "areas": ["fluo", "bio"], "code": "JTu5A.15", "title": "Diamond Nanopillar–Fiber Bundle Interface for Endoscopic Readout of Nitrogen-Vacancy Quantum Sensors", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "This work presents a fiber-coupled NV-diamond nanopillar platform that improves photon collection and optical readout efficiency, offering a flexible and scalable approach to nanoscale magnetic sensing applications.", "authors": "Olayinka Atobatele, Marian Smoluchowski Institute of Physics, Jagiellonian University, Krakow / Mariusz Mrózek, Marian Smoluchowski Institute of Physics, Jagiellonian University, Krakow / Adam Wojciechowski, Marian Smoluchowski Institute of Physics, Jagiellonian University, Krakow", "kind": "poster", "group": "Joint Poster Session II", "why": "NV photoluminescence read out through a fibre bundle, heading towards endoscopic sensing. Same session as the NV laser-writing poster (JTu5A.57), and a Central European group.", "id": "JTu5A.15-31"}, {"date": "2026-09-29", "rating": "nice", "areas": ["eye", "bio"], "code": "JTu5A.62", "title": "Asynchronous Optoretinography and Positive Scotopic Threshold Response Measurements Using a Spectral-Domain OCT System in the Rodent Retina", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "A 250 kHz SD-OCT+ERG system asynchronously measured ORG OPD of photoreceptors and pSTR responses during flicker stimulation in Brown Norway rats. Quantification of between-animal variability establishes functional endpoints and a baseline for future retinal disease studies.", "authors": "Simran Pattar, University of Waterloo / Khushmeet Dhaliwal, University of Waterloo / Jennifer Hunter, University of Waterloo", "kind": "poster", "group": "Joint Poster Session II", "id": "JTu5A.62-28"}, {"date": "2026-09-29", "rating": "nice", "areas": ["bio"], "code": "JTu5A.42", "title": "A Precision Medical Diagnosis and Monitoring Method Using Deep Optical Spectral Imaging", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "A theoretical multibeam interference optical spectral imaging method is proposed to achieve high-resolution, deep-penetration, tomographic medical imaging with reduced scattering noise, potentially improving precise disease diagnosis and physiological monitoring beyond existing optical spectral imaging techniques.", "authors": "Joyce Liu, University of Rochester Medical Center", "kind": "poster", "group": "Joint Poster Session II", "id": "JTu5A.42-29"}, {"date": "2026-09-29", "rating": "nice", "areas": ["fluo"], "code": "JTu5A.20", "title": "Optical Interactions of Lithium Diborate Glass Doped with Sm3+ and Containing Ag Nanoparticles", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "Optical properties of Lithium Diborate glass doped with Sm3+ and silver nanoparticles were studied. Absorption and emission analysis showed enhancement due to interaction of scattered light and energy transfer between silver nanoparticles and Sm3+ ions.", "authors": "Janet Elias, Universidad de Guanajuto / Miguel Vallejo-Hernández, Universidad de Guanajuto", "kind": "poster", "group": "Joint Poster Session II", "why": "metal nanoparticles enhancing emission from a dopant in glass. A materials angle on boosting fluorescence.", "id": "JTu5A.20-30"}, {"date": "2026-09-29", "rating": "must", "areas": ["laser", "fluo", "bio"], "code": "FTu6C.1", "title": "Pushing the Limit of Imaging Depth of Multiphoton Microscopy", "start": "15:30", "end": "16:00", "room": "Highland Room BJ", "abstract": "Recent advances for in vivo imaging at unprecedented depths and speed will be presented. Several directions for continued technology development, including advances in laser sources and the design of optimal illumination schemes will be discussed.", "authors": "Chris Xu, Cornell University", "tags": ["Invited"], "kind": "talk", "group": "Advances in Biomedical Technology and Applications I", "why": "the reference name in multiphoton imaging. Top quality.", "id": "FTu6C.1-32"}, {"date": "2026-09-29", "rating": "rec", "areas": ["eye"], "label": "Conflict", "code": "FTu6B.1", "title": "Challenges Towards Holographic Contact Lens Display", "start": "15:30", "end": "16:00", "room": "Highland Room AK", "abstract": "The holographic implementation of contact lens displays can generate images that can be focused by eyes with a thin form factor. The Japanese R&D project for the holographic contact lens displays is overviewed.", "authors": "Yasuhiro Takaki, Tokyo Univ of Agriculture and Technology", "tags": ["Invited"], "kind": "talk", "group": "VR/AV Theme: Future Displays", "why": "an unusual angle on contact lenses as optical devices. Only if you skip Xu", "id": "FTu6B.1-34"}, {"date": "2026-09-29", "rating": "must", "areas": ["eye", "bio"], "code": "FTu6C.2", "title": "Imaging the Metabolic Machinery of Vision: Tracking Single Cell Blood Flow and Mitochondria in the Living Retina", "start": "16:00", "end": "16:30", "room": "Highland Room BJ", "abstract": "Abstract not available", "authors": "Jesse Schallek, University of Rochester", "tags": ["Invited"], "kind": "talk", "group": "Advances in Biomedical Technology and Applications I", "why": "cutting-edge retinal imaging from the Rochester Center for Visual Science. The best ophthalmology talk of the week.", "id": "FTu6C.2-33"}, {"date": "2026-09-29", "rating": "must", "title": "Conference Reception", "start": "18:30", "end": "21:00", "room": "Riverside Court Galleria", "abstract": "Join us for an unforgettable evening at the FiO Conference Reception. Enjoy delicious food, engaging conversations and unparalleled networking opportunities with fellow attendees.", "kind": "event", "why": "a good moment to catch Rushnan or the Knox group informally. It's social, so drinks in moderation are fine.", "id": "Conference-Reception-35"}, {"date": "2026-09-30", "rating": "must", "areas": ["laser"], "code": "FW1E.1", "title": "Decoupling Local and Cumulative Stress Birefringence in Femtosecond-Laser-Written Fused Silica", "start": "08:00", "end": "08:15", "room": "Highland Room DG", "abstract": "Femtosecond-laser-written line arrays in fused silica produce two coupled retardance responses: a local line signal and a cumulative inter-line halo. The transverse retardance distribution of the written lines evolves through a regime transition, affecting peak-based retardance metrics.", "authors": "Jason Lu, University of New Mexico / Heng Zuo, University of New Mexico", "kind": "talk", "group": "Ultrafast Lasers and Applications I", "why": "this matters for how you measure OPD in densely written structures (peak-based metrics can mislead).", "id": "FW1E.1-36"}, {"date": "2026-09-30", "rating": "rec", "areas": ["fluo", "bio"], "label": "Alternative", "code": "FW1B.1", "title": "Phase-Diversity Wavefront Sensing for Adaptive Optics Light-Sheet Fluorescence Microscopy", "start": "08:00", "end": "08:30", "room": "Highland Room AK", "abstract": "Adaptive Optics approaches to sensing and correcting optical aberrations are underused in light sheet microscopy due to cost and difficulty. Here we demonstrate rapid, sensor-free correction of sample-induced aberrations inside living Caenorhabditis elegans embryo volumes.", "authors": "Courtney Johnson, Janelia Research Campus", "tags": ["Invited"], "kind": "talk", "group": "Advanced Optical Microscopy and Imaging", "id": "FW1B.1-38"}, {"date": "2026-09-30", "rating": "rec", "areas": ["bio", "ai"], "label": "Alternative", "code": "FW1A.1", "title": "Deep Learning–Enabled Clinical Photoacoustic Imaging", "start": "08:00", "end": "08:30", "room": "Grand Lilac Ballroom North", "abstract": "This talk highlights deep learning methods developed in our laboratory for translational photoacoustic imaging, including noise reduction, vessel enhancement, and radiomics-based feature extraction. Their applications in breast cancer imaging and foot ulcer imaging are introduced.", "authors": "Jun Xia, University at Buffalo", "tags": ["Invited"], "kind": "talk", "group": "Advances in Biomedical Technology and Applications II", "id": "FW1A.1-39"}, {"date": "2026-09-30", "rating": "rec", "areas": ["fluo", "bio"], "label": "Then", "code": "FW1A.2", "title": "Using fluorescent beads to approximate single fluorophores", "start": "08:30", "end": "08:45", "room": "Grand Lilac Ballroom North", "abstract": "We study optical microscopy calibration using fluorescent beads and single-molecule PSFs, showing how unpolarized emission affects system aberration measurement and evaluating phase masks designed to better emulate true single-fluorophore imaging behavior.", "authors": "Yi-Ting Feng, U of Rochester, The Institute of Optics / Luis Alemán-Castañeda, Aix Marseille Univ, CNRS, Centrale Marseille, Institut Fresnel / Thomas Brown, U of Rochester, The Institute of Optics / Sophie Brasselet, Aix Marseille Univ, CNRS, Centrale Marseille, Institut Fresnel / Miguel Alonso, U of Rochester, The Institute of Optics", "kind": "talk", "group": "Advances in Biomedical Technology and Applications II", "why": "practical calibration for your fluorescence microscopy.", "id": "FW1A.2-37"}, {"date": "2026-09-30", "rating": "nice", "areas": ["laser"], "code": "JW2A.1", "title": "Extreme Light for Discovery Science: Opportunities at LaserNetUS", "start": "09:15", "end": "10:00", "room": "Grand Lilac Ballroom North", "abstract": "LaserNetUS connects high-power laser facilities across North America to enable discovery science in plasma physics, fusion energy, particle acceleration, and advanced diagnostics. This talk highlights scientific opportunities across the network, including at LLNL's Jupiter Laser Facility, and shows how coordinated access, innovation, and partnership are advancing extreme light science.", "authors": "Félicie Albert, Lawrence Livermore National Laboratory", "kind": "talk", "group": "Joint Visionary Session: Extreme Light", "id": "JW2A.1-40"}, {"date": "2026-09-30", "rating": "rec", "code": "JW3A.1", "title": "Chip-Based Optical Frequency Combs", "start": "10:30", "end": "11:30", "room": "Empire Hall - Theater", "abstract": "I will review our recent work on Kerr frequency combs generated in microresonators. Such combs offer a rich system for studies of complex nonlinear dynamics and for applications in time and frequency metrology, spectroscopy, sensing and data communications.", "authors": "Alexander Gaeta, Columbia University", "tags": ["Plenary"], "kind": "talk", "group": "Joint Plenary Session II", "why": "a landmark topic in modern photonics, from one of its founders.", "id": "JW3A.1-41"}, {"date": "2026-09-30", "rating": "must", "areas": ["laser"], "code": "JW4A.34", "title": "Effects of Water on Induced Refractive Index Modification during Femtosecond Laser Writing in Hydrogels", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "Hydration state during femtosecond laser micromachining influences the resulting refractive index modification in transparent hydrogels. Dry-state writing produced larger peak refractive index changes and more confined axial index distributions than structures written directly in hydrated-state.", "authors": "Quazi Rushnan Islam, University of Rochester / Wayne Knox, University of Rochester", "kind": "poster", "group": "Joint Poster Session III", "id": "JW4A.34-42"}, {"date": "2026-09-30", "rating": "must", "areas": ["laser"], "code": "JW4A.18", "title": "Simulation of Femtosecond Laser Microprocessing on Glass", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "We demonstrate a simulation framework for predicting single-pulse ablation dynamics during femtosecond laser processing on glass. The model prediction of plasma and heat affected zones enables offline optimization of laser micromachining.", "authors": "Akif Qadeer, Rochester Institute of Technology / Nathan Klein, Rochester Institute of Technology / Jie Qiao, Rochester Institute of Technology", "kind": "poster", "group": "Joint Poster Session III", "why": "RIT is local, so a collaboration or visit is possible.", "id": "JW4A.18-43"}, {"date": "2026-09-30", "rating": "must", "areas": ["fluo", "bio"], "code": "JW4A.58", "title": "Multiplex Biomarker Analysis in Digital Histopathology Using Flourescence Lifetime Imaging", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "We propose a phase-analysis-based real-time confocal fluorescence lifetime imaging system for tumor cell characterization, enabling rapid structural and molecular analysis for digital histopathology and cancer diagnostics.", "authors": "Kiri Lee, Osong Medical Innovation Foundation / Dong Hui Seo, Osong Medical Innovation Foundation / Youngjae Won, INTEKMEDI / Seungrag Lee, Osong Medical Innovation Foundation", "kind": "poster", "group": "Joint Poster Session III", "why": "FLIM is a tool that could separate fluorophore species in your samples.", "id": "JW4A.58-44"}, {"date": "2026-09-30", "rating": "must", "areas": ["bio"], "code": "JW4A.55", "title": "Label-Free Physicochemical Analysis of Colon26 and MC38 Cells Using Combined ODT–Raman Platform", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "ODT and Raman spectroscopy were combined to profile colorectal cancer cell line, Colon26 and MC38 cells. MC38 showed higher RI-based density, whereas Colon26 exhibited stronger protein/lipid-related Raman ratios, demonstrating complementary physicochemical cell profiling.", "authors": "Minju Cho, University of Ulsan / Minseong Kwon, University of Ulsan / Suyeon Kang, University of Ulsan / Jun Ki Kim, University of Ulsan", "kind": "poster", "group": "Joint Poster Session III", "why": "refractive index plus Raman, the same pair of measurements you use.", "id": "JW4A.55-45"}, {"date": "2026-09-30", "rating": "rec", "areas": ["laser"], "code": "JW4A.53", "title": "Scalable Fabrication of Femtosecond Laser-Induced Columnar Structures on Aluminum", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "Femtosecond laser-induced columnar structures (fs-CSs) were investigated on aluminum. Following fs laser irradiation, ablated microcluster redeposition drives structural initiation, and flat-top beams enable selective oxidation and redeposition, allowing their scalable fabrication and controlled vertical growth.", "authors": "Taehoon Park, Korea Institute of Industrial Technology / Yong-dae Kim, Korea Institute of Industrial Technology / Jongweon Cho, Myongji University / Byounghwak Lee, Korea Military Academy / Taek Yong Hwang, Korea Institute of Industrial Technology", "kind": "poster", "group": "Joint Poster Session III", "id": "JW4A.53-46"}, {"date": "2026-09-30", "rating": "rec", "areas": ["fluo"], "code": "JW4A.27", "title": "Geometry-Dependent Optical Redistribution in NV Diamond Nanopillar Arrays", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "Optical redistribution between pillar and inter-pillar regions is observed in dense NV diamond nanopillar arrays. Widefield photoluminescence imaging reveals strong geometry and focus dependence, while FDTD modeling captures redistribution trends that influence array-level optical fidelity.", "authors": "Sondos Quqandi, King Abdullah Univ. for Science and Technology / Sharad Yadav, King Abdullah Univ. for Science and Technology / Ayman Hoblos, King Abdullah Univ. for Science and Technology / Jawaher Almutlaq, King Abdullah Univ. for Science and Technology", "kind": "poster", "group": "Joint Poster Session III", "why": "widefield PL imaging where the structure's geometry changes where the light appears. A useful caution when reading fluorescence images of patterned (e.g. laser-written) regions.", "id": "JW4A.27-49"}, {"date": "2026-09-30", "rating": "nice", "areas": ["laser"], "code": "JW4A.4", "title": "Optical Reflectance Behavior of Femtosecond Laser-Induced Columnar Structures on Aluminum", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "The optical reflectance of femtosecond laser-induced columnar structures (fs-CSs) on aluminum was investigated. Contrary to typical monotonic reductions, we report an increase in reflectance with a higher number of irradiating pulses on fs-CSs.", "authors": "Taehoon Park, Korea Institute of Industrial Technology / Yong-dae Kim, Korea Institute of Industrial Technology / Jongweon Cho, Myongji University / Byounghwak Lee, Korea Military Academy / Taek Yong Hwang, Korea Institute of Industrial Technology", "kind": "poster", "group": "Joint Poster Session III", "id": "JW4A.4-47"}, {"date": "2026-09-30", "rating": "nice", "areas": ["bio", "ai"], "code": "JW4A.87", "title": "A Comparative Machine Learning Analysis of Oesophageal Cancer tissue images obtained from Second Harmonic Generation microscopy", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "This study applies machine learning analysis to second harmonic generation microscopy images for esophageal cancer tissue classification. While SVM exhibited notable instability, XGBoost achieved higher accuracy and stability, successfully mapping complex, collagen alterations in tissues.", "authors": "Kausalya Makkithaya, Department of Biophysics / Guan-Yu Zhuo, National Yang Ming Chiao Tung University / Nirmal Mazumder, Department of Biophysics", "kind": "poster", "group": "Joint Poster Session III", "id": "JW4A.87-48"}, {"date": "2026-09-30", "rating": "nice", "code": "JW4A.5", "title": "Toward a Temperature-Insensitive Composite Diamond Clock", "start": "11:30", "end": "13:00", "room": "Empire Hall - Poster Session", "abstract": "We demonstrate a temperature-insensitive composite diamond clock formed by interleaving measurements of the NV electronic zero-field splitting and nuclear quadrupole parameter, achieving fractional instability below 5×10-9 at 200 s averaging time with 200× improved long-term stability over single-transition operation.", "authors": "Sean Lourette, University of California Berkeley / Andrey Jarmola, University of California Berkeley / Jabir Chathanathil, DEVCOM Army Research Laboratory / Victor Acosta, University of New Mexico / A. Birdwell, DEVCOM Army Research Laboratory / Peter Blümler, Johannes Gutenberg-Universität Mainz / Dmitry Budker, Johannes Gutenberg-Universität Mainz / Sebastián Carrasco, DEVCOM Army Research Laboratory / Tony Ivanov, DEVCOM Army Research Laboratory / Shimon Kolkowitz, University of California Berkeley / Vladimir Malinovsky, DEVCOM Army Research Laboratory", "kind": "poster", "group": "Joint Poster Session III", "why": "rounds out the NV diamond set. More quantum sensing than materials.", "id": "JW4A.5-50"}, {"date": "2026-09-30", "rating": "must", "areas": ["eye"], "code": "JW5A.49", "title": "Role of Optical Blur in Myopia Control Lenses", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "Myopia control lenses introduce structured blur while maintaining central correction. Eye-model simulations and Hartmann–Shack wavefront measurements of a DIMS lens sample demonstrate treatment-zone phase changes, informing future comparison of spectacle-lens designs.", "authors": "Hannah Gonzales, University College Dublin / Brian Vohnsen, University College Dublin", "kind": "poster", "group": "Joint Poster Session IV", "why": "myopia control is also where LIRIC-type refractive-index writing could have commercial impact.", "id": "JW5A.49-51"}, {"date": "2026-09-30", "rating": "rec", "areas": ["laser"], "code": "JW5A.17", "title": "Laser Induced Persistent Holographic Gratings Formed in Praseodymium Doped Barium-Tellurite Glasses", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "Strong persistent gratings were formed in praseodymium doped barium-tellurite glasses using the four-wave mixing technique. The gratings were written by an argon laser operating at 476.5 nm. The maximum change in the index of refraction was 0.00022.", "authors": "Abdulatif Hamad, Southern Illinois University Edwardsvill / Nathan Oliveira, Southern Illinois University Edwardsvill / Eric Voss, Southern Illinois University Edwardsvill", "kind": "poster", "group": "Joint Poster Session IV", "id": "JW5A.17-52"}, {"date": "2026-09-30", "rating": "rec", "areas": ["laser", "fluo"], "code": "JW5A.89", "title": "Laser-Assisted Synthesis of SnS2 Quantum Dots for Nonlinear Optical Limiting Applications", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "We demonstrate the synthesis of SnS2 quantum dots through pulsed laser irradiation of SnS2 nanoflakes in water. The quantum dots exhibit blue photoluminescence and optical limiting behavior, demonstrating potential for nonlinear photonic applications.", "authors": "Hasana EK, National Institute of Technology Calicut / Adarsh Raj KP, National Institute of Technology Calicut / Vari Sivaji Reddy, National Institute of Technology Calicut / Chandrasekharan Keloth, National Institute of Technology Calicut", "kind": "poster", "group": "Joint Poster Session IV", "why": "pulsed laser irradiation in water creates new luminescent species. A loose parallel to fluorophores forming during laser writing in hydrated materials.", "id": "JW5A.89-54"}, {"date": "2026-09-30", "rating": "nice", "areas": ["bio"], "code": "JW5A.33", "title": "Influence of Particle Size Distribution and Wavelength-Dependent Refractive Index on Skin-Mimicking Scattering from Polystyrene Microspheres", "start": "14:00", "end": "15:30", "room": "Empire Hall - Poster Session", "abstract": "We modeled wavelength-dependent scattering from mono- and polydisperse polystyrene microspheres to investigate skin-mimicking optical behavior. Results show that 500 nm polydisperse microspheres reproduced skin-like scattering slopes, while refractive-index dispersion and particle-size heterogeneity significantly altered scattering.", "authors": "Rana Dey, University of Dayton / Robert Wilson, University of Dayton", "kind": "poster", "group": "Joint Poster Session IV", "id": "JW5A.33-53"}, {"date": "2026-09-30", "rating": "rec", "areas": ["ai"], "title": "AI in Optical System Design", "start": "14:15", "end": "15:15", "room": "Empire Hall - Theater", "abstract": "Artificial intelligence is beginning to change how optical systems are designed, analyzed, and brought from concept to hardware. This panel at Optica FiO + LS brings together perspectives from academia, optical design software, manufacturing, and industry to explore where AI is delivering practical value today. The discussion will examine AI-assisted and agentic design workflows, automation and optimization, validation of AI-generated results, and the challenges of translating designs into manufacturable optical systems. Panelists will also discuss the role of engineering judgment, trust, and human oversight as AI becomes more integrated into optical and photonic design workflows.", "kind": "event", "why": "close to your DNAi work. It overlaps Poster IV, so see the myopia poster first.", "id": "AI-in-Optical-System-Design-55"}, {"date": "2026-09-30", "rating": "nice", "areas": ["fluo", "bio"], "code": "FW6D.1", "title": "Exploring Fundamental Limits in Biomedicine with Multiphoton Photothermal Microscopy", "start": "15:30", "end": "16:00", "room": "Highland Room CH", "abstract": "Multiphoton photothermal microscopy leverages nonradiative absorption to probe endogenous biomolecules with high sensitivity and specificity. This talk presents its theoretical foundations and biomedical applications in label-free metabolic imaging and background-suppressed deep-tissue microscopy.", "authors": "Nathaniel Hai, Boston University", "tags": ["Invited"], "kind": "talk", "group": "Optical Acquisition and Processing I", "why": "the counterpart to fluorescence. Explains what you can see when things **don't** fluoresce.", "id": "FW6D.1-56"}, {"date": "2026-09-30", "rating": "nice", "areas": ["bio"], "code": "FW6D.3", "title": "Microrobotic Guide Stars for Adaptive Optical Theranostics", "start": "16:30", "end": "17:00", "room": "Highland Room CH", "abstract": "Adaptive optics in scattering media requires guide stars that are both dynamic and controllable. Microrobots offer a new route to remotely addressable optical guide stars, creating opportunities for adaptive light delivery, localized sensing, and theranostic functionality.", "authors": "Nektarios Koukourakis, Technische Universität Dresden / John Boehm, Technische Universität Dresden / David Castellanos, CIC NanoGUNE / Mariana Medina-Sanchez, CIC NanoGUNE / Juergen Czarske, Technische Universität Dresden", "tags": ["Invited"], "kind": "talk", "group": "Optical Acquisition and Processing I", "id": "FW6D.3-57"}, {"date": "2026-09-30", "rating": "nice", "areas": ["laser"], "code": "LW7F.1", "title": "Tracking and Controlling Ultrafast Exciton Dynamics in Novel 2D Materials", "start": "17:30", "end": "18:00", "room": "Grand Lilac Ballroom South", "abstract": "In this talk, I will present new experimental developments in the use of time- and angle-resolved photoemission spectroscopy to directly visualize the momentum-resolved ultrafast dynamics of excitons in novel quantum materials.", "authors": "Alice Kunin, Princeton University", "tags": ["Invited"], "kind": "talk", "group": "Ultrafast Nanoscale Dynamics and Control", "id": "LW7F.1-58"}, {"date": "2026-09-30", "rating": "nice", "code": "LW7F.2", "title": "Giant Chiral Magnetoelectric Oscillations in a van der Waals Multiferroic", "start": "18:00", "end": "18:30", "room": "Grand Lilac Ballroom South", "abstract": "We investigate nonequilibrium dynamics of chiral electromagnons in exfoliated van der Waals multiferroics. Ultrafast measurements reveal giant magnetoelectric coupling and coherent intertwined dynamics of electric polarization and magnetization, highlighting collective chiral responses at terahertz frequencies.", "authors": "Edoardo Baldini, University of Texas at Austin", "tags": ["Invited"], "kind": "talk", "group": "Ultrafast Nanoscale Dynamics and Control", "id": "LW7F.2-59"}, {"date": "2026-09-30", "rating": "nice", "code": "LW7F.3", "title": "Ultrafast Nano-Imaging of Polaron Cation Coupling in Hybrid Perovskites", "start": "18:30", "end": "18:45", "room": "Grand Lilac Ballroom South", "abstract": "Hybrid perovskites exhibit spatially heterogeneous coupling between polarons and cations. The corresponding polaron lifetimes are affected by local structure, disorder, and composition. We develop ultrafast heterodyne pump-probe nano-imaging to address the ensuing heterogeneous polaron dynamics.", "authors": "Branden Esses, University of Colorado Boulder / Markus Raschke, University of Colorado Boulder", "kind": "talk", "group": "Ultrafast Nanoscale Dynamics and Control", "id": "LW7F.3-60"}, {"date": "2026-09-30", "rating": "nice", "areas": ["laser"], "code": "LW7F.4", "title": "All-Optical Coherent Control of Two-Color Laser Excited Ultrafast Photocurrent in 2D SnSe2 Films", "start": "18:45", "end": "19:00", "room": "Grand Lilac Ballroom South", "abstract": "We investigate photocurrent injection in SnSe2 films under two-color laser excitation and demonstrate all-optical coherent control of the photocurrent by tuning the relative phase and polarization states of the two-color fields.", "authors": "Xiangyu La, Tianjin University / Chenyin Dai, Tianjin University / Jiangqi Huang, Tianjin University / Zhen Tian, Tianjin University / Jianming Dai, Tianjin University", "kind": "talk", "group": "Ultrafast Nanoscale Dynamics and Control", "id": "LW7F.4-61"}, {"date": "2026-10-01", "rating": "rec", "areas": ["bio"], "code": "FTh1A.1", "title": "Polarimetric imaging with optical coherence tomography", "start": "08:00", "end": "08:30", "room": "Grand Lilac Ballroom North", "abstract": "Extending optical coherence tomography to measure tissue polarization effects provides contrast related to the microstructure and arrangement of tissue components. This talk will discuss recent technical advances and clinical applications across multiple medical specialties.", "authors": "Martin Villiger, Wellman Center for Photomedicine", "tags": ["Invited"], "kind": "talk", "group": "Optical Coherence Tomography II", "why": "Wellman is the top photomedicine centre, and polarimetry could also help characterise stress in written structures.", "id": "FTh1A.1-62"}, {"date": "2026-10-01", "rating": "rec", "areas": ["bio"], "code": "LTh2B.1", "title": "What is Life? Can We Measure It?", "start": "09:15", "end": "10:00", "room": "Grand Lilac Ballroom South", "abstract": "The posed quintessential question is not cast as an origins of life issue but rather directed towards understanding the underlying physics by which chemistry breathes life into otherwise inanimate matter. The real issue is how chemistry scales in complexity up to the level of biological systems. The light matter interactions being exploited to achieve this Moon Shot for Biology will be discussed as part of a proposal to launch a global initiative to map the cell.", "authors": "R. J. Dwayne Miller, University of Toronto", "kind": "talk", "group": "LS Visionary Session III", "why": "the most thought-provoking visionary talk. Good food for thought beyond your own field.", "id": "LTh2B.1-63"}, {"date": "2026-10-01", "rating": "rec", "areas": ["fluo"], "code": "LTh3F.2", "title": "Photophysical Dynamics of Colloidal Nanocrystals in the Strong Light-Matter Coupling Limit", "start": "11:00", "end": "11:30", "room": "Grand Lilac Ballroom South", "abstract": "We will discuss CdSe nanoplatelet excitons strongly-coupled to dielectric Fabry-Pérot microcavities, forming hybrid light-matter excitations called polaritons. Mixed quantum-classical dynamics simulations of the angle-resolved photophysics provide a clear explanation of the measured polariton population dynamics.", "authors": "Mitesh Amin, University of Rochester / Benjamin Hancock, University of Rochester / Farwa Awan, University of Rochester / Liam Burke, University of Rochester / Eric Koessler, University of Rochester / Nickolas Vamivakas, University of Rochester / Pengfei Huo, University of Rochester / Todd Krauss, University of Rochester", "tags": ["Invited"], "kind": "talk", "group": "Ultrafast Nonlinear and Strong-Field Dynamics", "why": "a leading nanocrystal photophysics researcher, based at Rochester. Fits the otherwise free late morning.", "notes": ["Rest of 10:30–12:30 is free. Use it for follow-up conversations, emails, or notes on what you learned."], "id": "LTh3F.2-64"}, {"date": "2026-10-01", "rating": "rec", "areas": ["laser"], "title": "X-lites Lunch & Learn and LLE Tour", "start": "13:00", "end": "15:00", "room": "University of Rochester", "kind": "event", "why": "a tour of the Laboratory for Laser Energetics (OMEGA), one of the world's major laser facilities.", "id": "X-lites-Lunch-Learn-and-LLE-Tour-65"}], "days": {"2026-09-27": {"subtitle": "arrival day", "notes": ["Nothing technical today. Use it for jet lag: a daylight walk or run, and an early night."]}, "2026-09-28": {"subtitle": "", "notes": []}, "2026-09-29": {"subtitle": "", "notes": []}, "2026-09-30": {"subtitle": "Rushnan's poster day ⭐", "notes": []}, "2026-10-01": {"subtitle": "", "notes": []}}};
const TZ = "America/New_York";
const R = {must:"⭐", rec:"🟡", nice:"⚪️"};
const A = {laser:"⚡", fluo:"✨", eye:"👁️", bio:"🧬", ai:"🤖"};
const DAYS = {"2026-09-27":["Sun","27","Sunday"],"2026-09-28":["Mon","28","Monday"],"2026-09-29":["Tue","29","Tuesday"],"2026-09-30":["Wed","30","Wednesday"],"2026-10-01":["Thu","1","Thursday"]};
const D = Object.keys(DAYS);
const items = DATA.items;
const byId = {}, byCode = {};
items.forEach(i => { byId[i.id] = i; if (i.code) byCode[i.code] = i; });

const KEY = "fio26";
let S = {plan:{}, day:null, view:"all", last:null};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

function now(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return {date:`${g("year")}-${g("month")}-${g("day")}`, time:`${g("hour").replace(/^24$/,"00")}:${g("minute")}`};
}
const m = t => { const [h,mm] = t.split(":").map(Number); return h*60+mm; };
const endm = i => Math.max(m(i.end || i.start), m(i.start) + 15);
function state(i, n){
  if (n.date !== i.date) return n.date > i.date ? "past" : "";
  const t = m(n.time); return t >= endm(i) ? "past" : t >= m(i.start) ? "live" : "";
}
const talk = i => i.kind !== "poster" && i.kind !== "info";
const clashes = i => !S.plan[i.id] || !talk(i) ? [] :
  items.filter(o => o !== i && S.plan[o.id] && talk(o) && o.date === i.date && m(o.start) < endm(i) && m(i.start) < endm(o));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
  .replace(/\b([FJL](?:M|Tu|W|Th)\d+[A-F]\.\d+)\b/g, (x,c) => byCode[c] ? `<a class="ref" href="#" data-jump="${byCode[c].id}">${c}</a>` : x);
const room = r => (r || "").replace(" - Poster Session","").replace("Empire Hall - ","Empire Hall, ").replace("Hyatt Regency - ","Hyatt, ");
function kind(i){
  const t = i.tags || [];
  if (t.includes("Plenary")) return "Plenary";
  if (/Visionary/.test(i.group || "")) return "Visionary";
  if (i.kind === "event") return "Event";
  return t.includes("Invited") ? "Invited" : "";
}
const who = i => { if (!i.authors) return ""; const a = i.authors.split(" / "); return a[0].split(",")[0] + (a.length > 1 ? " et al." : ""); };

const open = new Set(), closedP = new Set();
function rowHTML(i, n){
  const st = state(i, n), cl = clashes(i);
  const meta = [
    i.rating ? `<span class="r">${R[i.rating]}${(i.areas||[]).map(a => A[a]).join("")}</span>` : "",
    kind(i) ? `<span>${kind(i)}</span>` : "",
    i.kind !== "poster" && i.room ? `<span>${esc(room(i.room))}</span>` : "",
    who(i) ? `<span>${esc(who(i))}</span>` : "",
    i.code ? `<span>${esc(i.code)}</span>` : ""
  ].filter(Boolean).join("");
  const info = i.kind === "info";
  return `<div class="row ${i.rating || ""} ${st} ${open.has(i.id) ? "open" : ""}" id="r-${i.id}">
    <div class="t">${i.start}${i.end && i.end !== i.start ? `<span class="e">${i.end}</span>` : ""}</div>
    <div class="body" data-open="${i.id}">
      <div class="ti">${esc(i.title)}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
      ${i.why ? `<div class="why">${rich(i.why.charAt(0).toUpperCase() + i.why.slice(1))}</div>` : ""}
      ${(i.notes || []).map(x => `<div class="why">${rich(x)}</div>`).join("")}
      ${cl.length ? `<div class="clash">Overlaps ${cl.map(o => esc(o.code || o.title)).join(", ")}</div>` : ""}
      ${info ? "" : `<div class="more">
        ${i.authors ? `<h4>Authors</h4><p class="au">${esc(i.authors)}</p>` : ""}
        <h4>${i.kind === "event" ? "About" : "Abstract"}</h4><p>${i.abstract ? esc(i.abstract) : "Not available."}</p>
        ${i.group && i.kind !== "poster" ? `<h4>Session</h4><p class="au">${esc(i.group)} · ${esc(room(i.room))}</p>` : ""}
      </div>`}
    </div>
    ${info ? "<div></div>" : `<button class="star ${S.plan[i.id] ? "on" : ""}" data-plan="${i.id}" aria-label="Add to plan">${S.plan[i.id] ? "★" : "☆"}</button>`}
  </div>`;
}

function show(i){
  if (i.kind === "info") return S.view !== "plan";
  if (S.view === "must") return i.rating === "must";
  if (S.view === "plan") return !!S.plan[i.id];
  return true;
}

function render(){
  const n = now();
  document.getElementById("days").innerHTML = D.map(d =>
    `<button class="day ${S.day === d ? "on" : ""} ${n.date === d ? "today" : ""}" data-day="${d}"><small>${DAYS[d][0]}</small><b>${DAYS[d][1]}</b></button>`).join("");
  const dayItems = items.filter(i => i.date === S.day);
  const cnt = {all: dayItems.filter(i => i.kind !== "info").length, must: dayItems.filter(i => i.rating === "must").length, plan: dayItems.filter(i => S.plan[i.id]).length};
  document.getElementById("seg").innerHTML = [["all","All"],["must","Must see"],["plan","My plan"]]
    .map(([k,l]) => `<button class="${S.view === k ? "on" : ""}" data-view="${k}">${l}<span class="n">${cnt[k]}</span></button>`).join("");

  const list = dayItems.filter(show);
  const dn = DATA.days[S.day] || {};
  let h = `<div class="dayinfo"><b>${DAYS[S.day][2]}</b>${dn.subtitle ? ` · ${esc(dn.subtitle)}` : ""}${(dn.notes || []).map(x => `<br>${esc(x)}`).join("")}</div>`;
  if (!list.length) h += `<div class="empty">${S.view === "plan" ? "Nothing planned yet. Tap ☆ to add." : "Nothing here."}</div>`;

  // talks in order; posters of one session collapsed into a block at their start time
  const done = new Set();
  list.forEach(i => {
    if (done.has(i.id)) return;
    if (i.kind !== "poster") { h += rowHTML(i, n); return; }
    const ps = list.filter(p => p.kind === "poster" && p.group === i.group);
    ps.forEach(p => done.add(p.id));
    const key = S.day + i.group, st = state(i, n);
    const must = ps.filter(p => p.rating === "must").length;
    h += `<div class="pblock ${closedP.has(key) ? "closed" : ""}">
      <div class="phead row ${st}" data-pb="${esc(key)}" style="border:0;padding:0 0 10px">
        <div class="t">${i.start}<span class="e">${i.end}</span></div>
        <div><div class="ti">${esc(i.group.replace("Joint ",""))}<span class="chev">▾</span></div>
        <div class="meta"><span>${esc(room(i.room))}</span><span>${ps.length} poster${ps.length > 1 ? "s" : ""}${must ? ` · ${must} ⭐` : ""}</span></div></div>
      </div>
      ${ps.map(p => rowHTML(p, n)).join("")}
    </div>`;
  });
  document.getElementById("list").innerHTML = h;
}

function jump(id){
  const i = byId[id]; if (!i) return;
  S.day = i.date; S.view = "all"; open.add(id); closedP.delete(i.date + i.group); save(); render();
  document.getElementById("r-" + id)?.scrollIntoView({behavior:"smooth", block:"center"});
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-day],[data-view],[data-plan],[data-open],[data-pb],[data-jump]");
  if (!t) return;
  const d = t.dataset;
  if (d.jump) { e.preventDefault(); e.stopPropagation(); return jump(d.jump); }
  if (d.day) { S.day = d.day; scrollTo({top:0}); }
  else if (d.view) S.view = d.view;
  else if (d.plan) { S.plan[d.plan] ? delete S.plan[d.plan] : S.plan[d.plan] = 1; }
  else if (d.pb) { closedP.has(d.pb) ? closedP.delete(d.pb) : closedP.add(d.pb); }
  else if (d.open) { if (e.target.closest(".more")) return; open.has(d.open) ? open.delete(d.open) : open.add(d.open); }
  save(); render();
});

(function(){
  const n = now();
  if (!D.includes(S.day)) S.day = D.includes(n.date) ? n.date : D[0];
  if (D.includes(n.date) && S.last !== n.date) { S.day = n.date; S.last = n.date; }
  const h = location.hash.slice(1); if (D.includes(h)) S.day = h;
  save(); render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
